name: CI

# The checks from "Done means" in AGENTS.md (lint, typecheck, Vitest), plus the phone-size
# Playwright journeys. Nothing here deploys: the project is local-first (spec §3), and a
# deploy needs the owner's Cloudflare account.

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch cancels the older run, except on main, where every
# commit keeps its result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  WRANGLER_SEND_METRICS: "false"

jobs:
  checks:
    name: Lint, typecheck, unit and integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      # The pnpm version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  e2e:
    name: E2E journeys (Playwright, phone size)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      # Builds with OpenNext and serves on :8787 with fresh local D1, KV and Queues
      # (see webServer in playwright.config.ts).
      - run: pnpm test:e2e
      - name: Keep traces of failed tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
